name: RLS isolation tests

# Fase 2 de tests: aislamiento por rol contra un Supabase LOCAL efímero (Docker).
# Separado del CI normal (que no levanta Supabase). Corre cuando cambian las
# migraciones o los propios tests RLS, y bajo demanda.
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'tests/rls/**'
      - 'supabase/config.toml'
      - '.github/workflows/rls.yml'

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ trae WebSocket nativo, que supabase-js (realtime) necesita al
          # construir el cliente. Con Node 20 los tests fallan en createClient().
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (aplica las migraciones)
        run: supabase start

      - name: Grants (replica las default privileges de Supabase en el entorno local)
        # En prod, Supabase configura default privileges que otorgan ACCESO TOTAL al
        # schema public a service_role, authenticated y anon (verificado: los tres
        # tienen SELECT/INSERT/UPDATE/DELETE sobre todas las tablas). El Postgres local
        # del CLI no las reproduce para las tablas creadas por migraciones → se otorgan
        # explícitamente, o `authenticated` no puede ni intentar leer las tablas nuevas
        # (invoices, billing_plans, machine_counters, contract_machines, maintenance_*…)
        # y los tests darían 0 filas por permiso denegado, no por RLS.
        #
        # IMPORTANTE: otorgar a authenticated NO falsea el aislamiento. El GRANT solo
        # permite "intentar"; RLS sigue siendo la única puerta que decide QUÉ filas se
        # ven. Es exactamente el estado de producción. (anon se deja como está: sus
        # tests esperan 0 filas, que se cumple igual por RLS o por permiso denegado.)
        run: |
          DB_URL=$(supabase status -o json | jq -r '.DB_URL')
          psql "$DB_URL" -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO service_role, authenticated; GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO service_role, authenticated;"
          # El GRANT ALL anterior deshace la restricción de columna de profiles
          # (migración 20260610100000: authenticated solo puede UPDATE full_name/phone,
          # no role/is_dispatcher). La re-aplicamos para reproducir prod fielmente y
          # mantener viva la capa "GRANT por columna" que prueba profiles-isolation.
          psql "$DB_URL" -c "REVOKE UPDATE ON public.profiles FROM authenticated; GRANT UPDATE (full_name, phone) ON public.profiles TO authenticated;"

      - name: Exportar claves locales al entorno
        run: |
          echo "API_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Tests de aislamiento RLS
        run: npm run test:rls

      - name: Stop Supabase
        if: always()
        run: supabase stop
